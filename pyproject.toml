[project]
name = "pytestmut"
version = "0.1.0"
description = "Mutation testing for pytest: correct verdicts on every OS, parallel runs, and per-path policies for critical code"
authors = [{ name = "Martin Jespersen", email = "martincjespersen@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
pytestmut = "pytestmut.cli:app"

[project.entry-points.pytest11]
pytestmut = "pytestmut.pytest_plugin"

[dependency-groups]
dev = [
    "autoflake>=1.4",
    "black>=22.1.0",
    "flake8>=4.0.1",
    "isort>=5.10.1",
    "mdx-include>=1.4.1",
    "mkdocs>=1.2.3",
    "mkdocs-material>=8.1.4",
    "mkdocstrings[python]>=0.17.0",
    "mypy>=0.930",
    "loglicense>=0.1.11",
    "nox>=2021.10.1",
    "pre-commit>=2.16.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=3.0.0",
    "pytest-xdist>=2.5.0",
    "pytest-random-order>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs the whole tool against a generated fixture project"]

[tool.pytestmut]
# pytestmut tests itself: the modules that decide verdicts and gates.
paths = [
    "pytestmut/verdict",
    "pytestmut/policy",
    "pytestmut/source/text.py",
    "pytestmut/source/discovery.py",
    "pytestmut/pytest_integration/cmdline.py",
]

[tool.pytestmut.pytest]
args = ["-m", "not e2e"]

[tool.pytestmut.timeout]
# The unit tests selected for one mutant finish in about a second, and the
# mutants that time out loop forever, so short budgets lose nothing. Budgets
# still scale with the time measured on the machine (3x plus grace), and
# every timeout is retried alone and checked against an unmutated run.
floor_seconds = 3
grace_seconds = 2
retry_factor = 1.5

[tool.pytestmut.thresholds]
# Every mutant is currently killed; keep it that way.
min_score = 95.0
max_survivors = 0
max_no_coverage = 0

# The code that decides what a mutant's status is and whether a run passes:
# a mistake here makes every reported number wrong.
[[tool.pytestmut.policy]]
name = "verdicts"
paths = ["pytestmut/verdict/classify.py", "pytestmut/policy/evaluate.py"]
min_score = 95.0
max_survivors = 0
max_no_coverage = 0
require_reason = true

[tool.pytestmut.report]
formats = ["text", "html"]

[tool.coverage.report]
omit = ["pytestmut/__main__.py"]

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
# sitecustomize.py must stay importable by any interpreter that inherits
# PYTHONPATH, so it carries no annotations.
exclude = ['pytestmut/_shim/sitecustomize\.py$']

[tool.hatch.build.targets.wheel]
packages = ["pytestmut"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
