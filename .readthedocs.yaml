# Read the Docs build configuration.
# Reference: https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_build:
      # Refresh the mutation report that the "Mutation report" page shows.
      # Builds get 15 minutes and 7 GB of memory on the free plan, with few
      # CPUs, so the run is time-boxed:
      # - --time-limit 420: no new mutant starts after 7 minutes; the rest are
      #   reported as not run, the report is marked partial, and the run
      #   exits 1, which still publishes the docs (as a missed threshold does).
      # - timeout 600 is the backstop: pytestmut treats its SIGTERM like
      #   Ctrl-C and cleans up, and the page then says no report was made.
      # Any other failure (broken tests, bad config) stops the build.
      - >-
        timeout --kill-after=60 600
        python -m pytestmut run --report text --report html
        --max-memory 3GiB --time-limit 420
        || test $? -le 1 -o $? -eq 124 -o $? -eq 137
      # Refresh the "Dependency licenses" page. A failed check (exit 1 or 2)
      # still writes the table, so it is published; CI is the gate.
      - mkdir -p build
      - >-
        python -m loglicense check --dependency-file uv.lock --output-file build/licenses.md
        || test $? -le 2

python:
  install:
    - method: uv
      command: sync
      groups:
        - dev

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
