repos:
  - repo: local
    hooks:
      - id: black
        name: Check Code Format (black)
        entry: nox -s 'Check Code Format' --
        language: python
        types_or: [python, pyi, jupyter]
      - id: isort
        name: Import Checking (isort)
        entry: nox -s 'Import Checking' --
        language: python
        types_or: [python]
      - id: loglicense
        name: License Checking (loglicense)
        entry: nox -s 'License Checking'
        pass_filenames: false
        language: python
        files: ^(uv\.lock|pyproject\.toml|\.loglicense)$
      - id: flake8
        name: Lint Checking (flake8)
        entry: nox -s 'Lint Checking' --
        language: python
        types_or: [python]
      - id: mypy
        name: Type Checking (mypy)
        entry: nox -s 'Type Checking' --
        language: python
        types_or: [python]
      - id: pytest
        name: Unit Tests (pytest)
        entry: nox -s 'Unit Tests'
        pass_filenames: false
        language: python
        types_or: [python]



