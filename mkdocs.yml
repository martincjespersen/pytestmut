site_name: pytestmut
site_description: Mutation testing for pytest
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
hooks:
  - docs/hooks/mutation_report.py
exclude_docs: |
  hooks/
plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Reading the results: guides/results.md
      - Choosing what to test: guides/scoping.md
      - Leaving code alone: guides/suppressing.md
      - Strict rules for critical code: guides/policies.md
      - Pre-commit: guides/pre-commit.md
      - CI/CD: guides/ci.md
      - Coding agents: guides/agents.md
      - Reports in your docs site: guides/docs-site.md
      - Speed and memory: guides/performance.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - Command line: reference/cli.md
      - Configuration: reference/configuration.md
      - Mutation operators: reference/operators.md
      - How it works: how-it-works.md
      - Python API: api.md
  - This project's mutation report: mutation.md
